  <style>
:root {
  color-scheme: dark;
  --muzoi-ink: #0e0e16;
  --muzoi-text: #fff9fd;
  --muzoi-pink: #f4bce5;
  --muzoi-muted: #c9bfcc;
  --muzoi-line: rgba(236, 218, 238, .28);
  --muzoi-gutter: clamp(17px, 4.8vw, 32px);
  --muzoi-safe-top: env(safe-area-inset-top, 0px);
  --muzoi-safe-right: env(safe-area-inset-right, 0px);
  --muzoi-safe-bottom: env(safe-area-inset-bottom, 0px);
  --muzoi-safe-left: env(safe-area-inset-left, 0px);
  --muzoi-left: max(var(--muzoi-gutter), calc(var(--muzoi-safe-left) + 10px));
  --muzoi-right: max(var(--muzoi-gutter), calc(var(--muzoi-safe-right) + 10px));
  background: var(--muzoi-ink);
  color: var(--muzoi-text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  -webkit-text-size-adjust: 100%;
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
}

body { position: fixed; inset: 0; background: var(--muzoi-ink); }
h1, h2, p { margin: 0; }
img { display: block; max-width: 100%; }
a { color: inherit; text-underline-offset: 4px; }
button { font: inherit; cursor: pointer; }
button, a, summary { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
[hidden] { display: none !important; }

:is(button, a, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--muzoi-pink);
  outline-offset: 3px;
}

.muzoi-app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
}

.muzoi-footer { padding-inline: var(--muzoi-left) var(--muzoi-right); }
.muzoi-footer-inner { width: min(100%, 640px); margin-inline: auto; }
.muzoi-primary {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 54px;
  padding: 12px 20px;
  border: 0;
  border-radius: 19px;
  background: linear-gradient(105deg, #ffc2eb, #ed70e5);
  color: #181018;
  font-size: 1.125rem;
  font-weight: 750;
  line-height: 1.22;
  transition: transform .18s ease, filter .18s ease;
}

.muzoi-primary:active:not(:disabled) { transform: scale(.985); filter: brightness(.93); }
.muzoi-primary:disabled { cursor: default; opacity: .55; }
.muzoi-noscript {
  position: fixed;
  inset: auto 16px calc(var(--muzoi-safe-bottom) + 16px);
  padding: 16px;
  border-radius: 16px;
  background: #281727;
}

/* 手势限制只作用于独立展示页，规则和协议的正文仍可以滚动。 */
body[data-muzoi-locked] {
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

body[data-muzoi-locked] img { -webkit-user-drag: none; }
body[data-muzoi-locked] [data-muzoi-scroll] { overscroll-behavior: none; touch-action: pan-y; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

.muzoi-welcome {
  background:
    radial-gradient(ellipse 105% 50% at 100% 100%, #ca0088 0%, transparent 84%),
    radial-gradient(ellipse 90% 36% at 85% 70%, #773053 0%, transparent 82%),
    linear-gradient(168deg, #1a181b 20%, #231722 44%, #3d1236 72%, #72065b 100%);
}

.muzoi-welcome-header {
  display: grid;
  justify-items: center;
  gap: clamp(12px, 1.8dvh, 22px);
  padding: max(calc(var(--muzoi-safe-top) + 6px), 6.1dvh) var(--muzoi-right) 0 var(--muzoi-left);
  text-align: center;
}

.muzoi-brand {
  width: clamp(94px, 32vw, 155px);
  height: auto;
  -webkit-mask-image: linear-gradient(#0000, #000 8%, #000 92%, #0000);
  mask-image: linear-gradient(#0000, #000 8%, #000 92%, #0000);
}

.muzoi-welcome h1 {
  font-size: clamp(1.6rem, min(11.45vw, 6.05dvh), 3.75rem);
  font-weight: 800;
  line-height: 1.01;
  letter-spacing: -.045em;
  text-transform: uppercase;
}

.muzoi-welcome h1 span { display: block; color: #fa74d5; }
.muzoi-welcome-main {
  display: grid;
  min-width: 0;
  min-height: 0;
  place-items: center;
  overflow: hidden;
  container-type: size;
  padding: clamp(4px, 1.7dvh, 18px) max(var(--muzoi-safe-right), 4px) 0 max(var(--muzoi-safe-left), 4px);
  touch-action: none;
}

/* 只取参考图中的眼妆拼贴，设备边框、系统元素和底部按钮不参与合成。 */
.muzoi-welcome-art {
  width: min(100%, 540px);
  height: 100%;
  min-height: 0;
  object-fit: contain;
  -webkit-mask-image: linear-gradient(#0000, #000 3%, #000 94%, #0000), linear-gradient(90deg, #0000, #000 2.5%, #000 97.5%, #0000);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(#0000, #000 3%, #000 94%, #0000), linear-gradient(90deg, #0000, #000 2.5%, #000 97.5%, #0000);
  mask-composite: intersect;
}

@supports (width: 1cqh) {
  .muzoi-welcome-art { width: min(100cqw, calc(100cqh * .83636), 540px); height: auto; }
}

.muzoi-welcome-footer {
  padding-top: clamp(8px, 2.6dvh, 25px);
  padding-bottom: max(calc(var(--muzoi-safe-bottom) + 19px), 6.25dvh);
}

.muzoi-welcome-footer .muzoi-primary {
  min-height: clamp(52px, 7.1dvh, 72px);
  box-shadow: 0 8px 26px #4f073f40;
}

@media (max-height: 690px) and (orientation: portrait) {
  .muzoi-welcome-header { padding-top: max(calc(var(--muzoi-safe-top) + 4px), 4dvh); gap: 9px; }
  .muzoi-brand { width: clamp(76px, 26vw, 115px); }
  .muzoi-welcome-footer { padding-top: 8px; padding-bottom: max(calc(var(--muzoi-safe-bottom) + 10px), 4dvh); }
}

@media (orientation: landscape) and (max-height: 580px) {
  .muzoi-welcome {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    padding-top: var(--muzoi-safe-top);
  }
  .muzoi-welcome-header {
    grid-column: 1;
    align-content: center;
    padding: 8px 8px 8px var(--muzoi-left);
  }
  .muzoi-brand { width: clamp(64px, 15dvh, 108px); }
  .muzoi-welcome h1 { font-size: clamp(1.35rem, 9dvh, 2.65rem); }
  .muzoi-welcome-main {
    grid-column: 2;
    grid-row: 1 / -1;
    padding: 6px var(--muzoi-right) max(7px, var(--muzoi-safe-bottom)) 5px;
  }
  .muzoi-welcome-footer {
    grid-column: 1;
    padding: 5px 12px max(9px, calc(var(--muzoi-safe-bottom) + 7px)) var(--muzoi-left);
  }
  .muzoi-welcome-footer .muzoi-primary { min-height: 46px; }
}

/* 独立预览的按钮等待反馈，App 内由原生加载层接管。 */
body[data-muzoi-locked] .muzoi-primary { position: relative; }
body[data-muzoi-locked] .muzoi-primary[aria-busy="true"] { opacity: 1; cursor: wait; }
body[data-muzoi-locked] .muzoi-button-label { transition: opacity .15s ease; }

  <noscript><p class="muzoi-noscript">Enable JavaScript to continue.</p></noscript>
<script>
/* 页面专用消息桥和按钮状态 */
(() => {
  'use strict';
  const page = document.body.dataset.muzoiPage;
  if (!['welcome', 'rules'].includes(page)) return;

  const contracts = Object.freeze({
    welcome: Object.freeze({ channel: 'MuzoiWelcome', source: 'MuzoiWelcome' }),
    rules: Object.freeze({ channel: 'MuzoiCommunityRules', source: 'MuzoiCommunity' })
  });
  const contract = contracts[page];
  let phase = 'idle';
  let activeButton = null;
  let attempt = 0;

  function feedback(button, busy, announcement = '') {
    if (!button.querySelector('.muzoi-button-label')) {
      const label = document.createElement('span');
      label.className = 'muzoi-button-label';
      label.textContent = button.textContent;
      const spinner = document.createElement('span');
      spinner.className = 'muzoi-button-spinner';
      spinner.setAttribute('aria-hidden', 'true');
      spinner.hidden = true;
      const status = document.createElement('span');
      status.className = 'muzoi-assistive-status';
      status.setAttribute('role', 'status');
      button.replaceChildren(label, spinner, status);
    }
    button.disabled = busy;
    button.setAttribute('aria-busy', String(busy));
    button.querySelector('.muzoi-button-spinner').hidden = !busy;
    button.querySelector('.muzoi-assistive-status').textContent = announcement;
  }

  function reset() {
    attempt++;
    phase = 'idle';
    if (activeButton) feedback(activeButton, false);
    activeButton = null;
  }

  async function activate(button, beforeSend) {
    if (phase !== 'idle') return false;
    phase = 'preparing';
    const currentAttempt = ++attempt;
    activeButton = button;
    feedback(button, true, 'Please wait.');
    try {
      if (beforeSend) await beforeSend();
      if (currentAttempt !== attempt) return false;
      const payload = { action: 'Sure', source: contract.source };
      const handler = window.webkit?.messageHandlers?.[contract.channel];
      if (handler && typeof handler.postMessage === 'function') {
        // 发送前锁定按钮，兼容宿主同步回执。超时不自动重发。
        phase = 'awaiting';
        const result = handler.postMessage(payload);
        // 等待可回复的消息桥，统一处理发送失败。
        if (result && typeof result.then === 'function') await result;
      } else {
        phase = 'preview';
        window.dispatchEvent(new CustomEvent('muzoi:continue', {
          detail: { channel: contract.channel, payload: { ...payload } }
        }));
        // 独立浏览器预览结束等待后恢复按钮。
        await new Promise(resolve => setTimeout(resolve, 650));
        if (currentAttempt === attempt) reset();
      }
      return true;
    } catch (_) {
      if (currentAttempt === attempt) {
        phase = 'idle';
        feedback(button, false, 'Unable to continue. Please try again.');
      }
      return false;
    }
  }

  function acknowledge(message) {
    if (!message || message.source !== contract.source || typeof message.success !== 'boolean' || phase !== 'awaiting') return false;
    if (message.success) {
      phase = 'complete';
      feedback(activeButton, false, 'Ready.');
      // 宿主离开当前页前保持按钮锁定，防止重复跳转。
      activeButton.disabled = true;
    } else {
      phase = 'idle';
      feedback(activeButton, false, 'Unable to continue. Please try again.');
    }
    return true;
  }

  window.MuzoiGlamBridge = Object.freeze({ activate, acknowledge, isLocked: () => phase !== 'idle' });
  window.addEventListener('pageshow', event => { if (event.persisted) reset(); });
})();

</script>
<script>
/* 欢迎页入口 */
(() => {
  'use strict';
  const button = document.getElementById('muzoi-start');
  button.addEventListener('click', () => {
    if (window.MuzoiGlamBridge.isLocked()) return;
    window.MuzoiGlamBridge.activate(button);
  });
  window.dispatchEvent(new CustomEvent('muzoi:ready', { detail: { page: 'welcome' } }));
})();
</script>
<script>
/* 仅限制当前独立页面的手势 */
(() => {
  'use strict';
  if (!['welcome', 'rules'].includes(document.body.dataset.muzoiPage)) return;
  document.body.dataset.muzoiLocked = 'true';
  const nonPassive = { passive: false };
  const prevent = event => { if (event.cancelable) event.preventDefault(); };
  const interactive = target => target.closest('button, a, input, label, summary');
  const readerAt = target => target.closest('[data-muzoi-scroll]');
  let lastY = 0;
  let lastTap = 0;

  // 监听器随当前文档销毁，限制不会传到其他网页。
  for (const type of ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'selectstart', 'copy', 'cut', 'dragstart', 'dblclick']) {
    document.addEventListener(type, prevent, nonPassive);
  }
  document.querySelectorAll('img').forEach(image => { image.draggable = false; });

  document.addEventListener('touchstart', event => {
    if (event.touches.length > 1) { prevent(event); return; }
    lastY = event.touches[0]?.clientY ?? 0;
  }, nonPassive);
  document.addEventListener('touchmove', event => {
    if (event.touches.length !== 1) { prevent(event); return; }
    const y = event.touches[0].clientY;
    const delta = y - lastY;
    lastY = y;
    const reader = readerAt(event.target);
    if (!reader || reader.scrollHeight <= reader.clientHeight + 1 ||
        (delta > 0 && reader.scrollTop <= 0) ||
        (delta < 0 && reader.scrollTop + reader.clientHeight >= reader.scrollHeight - 1)) prevent(event);
  }, nonPassive);
  document.addEventListener('touchend', event => {
    if (event.touches.length) return;
    const now = Date.now();
    if (now - lastTap < 300 && !interactive(event.target)) prevent(event);
    lastTap = now;
  }, nonPassive);
  document.addEventListener('wheel', event => {
    const reader = readerAt(event.target);
    if (event.ctrlKey || !reader || reader.scrollHeight <= reader.clientHeight + 1 ||
        (event.deltaY < 0 && reader.scrollTop <= 0) ||
        (event.deltaY > 0 && reader.scrollTop + reader.clientHeight >= reader.scrollHeight - 1) ||
        event.deltaY === 0) prevent(event);
  }, nonPassive);
  document.addEventListener('keydown', event => {
    if ((event.ctrlKey || event.metaKey) && ['+', '-', '=', '0'].includes(event.key)) { prevent(event); return; }
    if ([' ', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End'].includes(event.key) &&
        !interactive(event.target) && !readerAt(event.target)) prevent(event);
  });
})();

</script>
