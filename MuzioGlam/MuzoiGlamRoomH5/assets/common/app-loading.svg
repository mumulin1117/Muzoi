<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">
  <defs>
    <radialGradient id="opalineAura" cx="50%" cy="47%" r="50%">
      <stop offset="0" stop-color="#ef97e5" stop-opacity=".34"/>
      <stop offset=".62" stop-color="#ef97e5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ef97e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roseQuartzCirclet" x1="28" y1="22" x2="170" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef97e5"/>
      <stop offset=".38" stop-color="#ffd68f"/>
      <stop offset=".7" stop-color="#fff0ec"/>
      <stop offset="1" stop-color="#e66ed7"/>
    </linearGradient>
    <linearGradient id="nacreMirror" x1="77" y1="61" x2="126" y2="113" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8f4"/>
      <stop offset=".48" stop-color="#f7dbe9"/>
      <stop offset="1" stop-color="#dba8d7"/>
    </linearGradient>
    <linearGradient id="sableBristles" x1="128" y1="57" x2="144" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb3d8"/>
      <stop offset="1" stop-color="#e85eb1"/>
    </linearGradient>
    <filter id="petalGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .opaline-aura { animation: opaline-breathe 1.8s ease-in-out infinite; transform-origin: 100px 100px; }
    .rose-quartz-circlet { animation: rose-quartz-orbit 2.6s linear infinite; transform-origin: 100px 100px; }
    .camellia-compact { animation: camellia-float 1.9s ease-in-out infinite; transform-origin: 100px 105px; }
    .scintilla-one { animation: scintilla-twinkle 1.15s ease-in-out infinite; transform-origin: 151px 48px; }
    .scintilla-two { animation: scintilla-twinkle 1.4s .2s ease-in-out infinite; transform-origin: 45px 107px; }
    .scintilla-three { animation: scintilla-twinkle 1.65s .35s ease-in-out infinite; transform-origin: 148px 145px; }
    @keyframes rose-quartz-orbit { to { transform: rotate(360deg); } }
    @keyframes opaline-breathe { 0%, 100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes camellia-float { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-5px); } }
    @keyframes scintilla-twinkle { 0%, 100% { opacity: .24; transform: scale(.62); } 50% { opacity: 1; transform: scale(1.14); } }
    @media (prefers-reduced-motion: reduce) {
      .opaline-aura, .rose-quartz-circlet, .camellia-compact,
      .scintilla-one, .scintilla-two, .scintilla-three { animation: none; }
    }
  </style>

  <circle class="opaline-aura" cx="100" cy="100" r="72" fill="url(#opalineAura)"/>
  <g class="rose-quartz-circlet">
    <circle cx="100" cy="100" r="76" fill="none" stroke="#ef97e5" stroke-opacity=".14" stroke-width="2"/>
    <circle cx="100" cy="100" r="68" fill="none" stroke="url(#roseQuartzCirclet)" stroke-width="5" stroke-linecap="round" stroke-dasharray="34 15 8 17"/>
    <circle cx="100" cy="32" r="4" fill="#fff0ec" filter="url(#petalGlow)"/>
  </g>

  <g class="camellia-compact">
    <circle cx="100" cy="87" r="39" fill="#2e1935" stroke="#ef97e5" stroke-width="2"/>
    <circle cx="100" cy="87" r="30" fill="url(#nacreMirror)" stroke="#fff8f4" stroke-opacity=".72" stroke-width="2"/>
    <path d="M75 117h50c10 0 18 8 18 18s-8 18-18 18H75c-10 0-18-8-18-18s8-18 18-18Z" fill="#3b2344" stroke="#ef97e5" stroke-opacity=".8" stroke-width="2"/>
    <circle cx="78" cy="135" r="8" fill="#f57bb3" stroke="#fff" stroke-opacity=".42"/>
    <circle cx="100" cy="135" r="8" fill="#f9b59b" stroke="#fff" stroke-opacity=".42"/>
    <circle cx="122" cy="135" r="8" fill="#f9d27f" stroke="#fff" stroke-opacity=".42"/>
    <path d="M132 68 86 133" fill="none" stroke="#ffd78f" stroke-width="7" stroke-linecap="round"/>
    <path d="M137 59c11 1 15 8 12 19l-17-7Z" fill="url(#sableBristles)"/>
    <path d="M91 126 84 137" fill="none" stroke="#fff2dc" stroke-opacity=".62" stroke-width="2" stroke-linecap="round"/>
  </g>

  <path class="scintilla-one" d="m151 36 4 8 8 4-8 4-4 8-4-8-8-4 8-4Z" fill="#ffe6a9" filter="url(#petalGlow)"/>
  <path class="scintilla-two" d="m45 99 3 5 5 3-5 3-3 6-3-6-6-3 6-3Z" fill="#fff0ec" filter="url(#petalGlow)"/>
  <path class="scintilla-three" d="m148 139 2 4 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#ffd68f" filter="url(#petalGlow)"/>
</svg>
